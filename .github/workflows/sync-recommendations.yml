name: Sync LinkedIn Recommendations

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:     # Manual 1-click trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_PROFILE_ID: "fazalmahmudhassan"
        run: node scripts/sync-linkedin-recommendations.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-data.json
          git diff-index --quiet HEAD || (git commit -m "chore(data): auto-sync latest LinkedIn recommendations [skip ci]" && git push origin main)
